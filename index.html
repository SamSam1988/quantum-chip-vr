<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Quantum Chip Photon VR v29 (off-axis StereoCamera, real VR)</title>
  <style>
    html,body{margin:0;overflow:hidden;background:#0c1622;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
    /* v35: ordinary view — buttons stacked RIGHT, just above dashboard, 30% larger, in pairs */
    #ui{position:fixed;right:8px;bottom:120px;z-index:10;display:flex;flex-direction:column;gap:3px;max-width:none;align-items:flex-end}
    #ui .ui-row{display:flex;gap:3px;justify-content:flex-end}
    button{border:0;border-radius:5px;padding:5px 8px;font-weight:800;font-size:9px;background:#59ffc0;color:#02110c;box-shadow:0 0 7px rgba(89,255,192,.25);cursor:pointer}
    button.secondary{background:#ffe16b;color:#100d00}
    button.dark{background:#dde8ff;color:#06101f}
    button.boost{background:#ff7a3d;color:#1b0a00;box-shadow:0 0 12px rgba(255,122,61,.40)}
    button.boost.active{background:#ff3d3d;color:#fff;box-shadow:0 0 16px rgba(255,61,61,.7)}

    /* v27: HUD restacked vertically — instrument row (map + speed + altitude) on top,
       Qarakal logo below. Narrower footprint so it no longer overlaps the bottom-centre
       artificial horizon in landscape. */
    #hud{position:fixed;right:8px;bottom:1px;z-index:10;background:rgba(0,0,0,.55);padding:3px 6px;border-radius:10px;display:flex;flex-direction:column;gap:2px;align-items:center;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 12px rgba(89,255,192,.12)}
    #hud .row{display:flex;gap:6px;align-items:flex-end}
    #hud .cell{width:62px;text-align:center;color:#fff;font-family:system-ui,-apple-system,sans-serif}
    #hud .lbl{font-size:6px;opacity:.78;text-transform:uppercase;letter-spacing:.07em}
    #hud .val{font-size:11px;font-weight:900;line-height:1.0;margin:1px 0}
    #hud .unit{font-size:6px;opacity:.78}
    #hud .gauge{position:relative;width:50px;height:14px;margin:2px auto 0;overflow:hidden}
    #hud .arc{position:absolute;left:5px;top:2px;width:40px;height:20px;border:2px solid rgba(221,232,255,.28);border-bottom:0;border-radius:40px 40px 0 0}
    #hud .needle{position:absolute;left:24px;bottom:0;width:2px;height:12px;background:#59ffc0;border-radius:3px;transform-origin:50% 100%;transform:rotate(-82deg);box-shadow:0 0 6px rgba(89,255,192,.7)}
    #hud .altNeedle{background:#ffd166;box-shadow:0 0 6px rgba(255,209,102,.7)}
    #hud .map-cell{width:50px}
    #hud .map-cell canvas{display:block;width:48px;height:48px;border-radius:4px;background:#101418;border:1px solid rgba(255,255,255,.18)}
    #hud .logo-cell{width:auto;display:flex;align-items:center;justify-content:center;padding:0 4px}
    #hud .logo-cell img{height:28px;max-height:28px;width:auto;display:block;object-fit:contain}
    #hud .logo-cell img.hidden{display:none}

    /* v37: Game Mode UI */
    button#gameBtn{font-size:13px;padding:7px 12px;background:#ff3a8a;color:#fff;box-shadow:0 0 14px rgba(255,58,138,.55);font-weight:900;letter-spacing:.04em}
    button#gameBtn.active{background:#ffd166;color:#111}
    #gameMsg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;background:rgba(0,0,0,.85);color:#fff;padding:20px 26px;border-radius:14px;border:2px solid #ff3a8a;max-width:80%;font:14px/1.4 system-ui,sans-serif;display:none;text-align:center;box-shadow:0 0 30px rgba(255,58,138,.5)}
    #gameMsg h2{margin:0 0 8px;font-size:18px;color:#ff7ab3}
    #gameMsg button{margin-top:14px;background:#59ffc0;color:#02110c;border:0;border-radius:6px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer}
    /* Bloch sphere panel — left side, used in game mode only */
    #bloch{position:fixed;left:8px;top:50%;transform:translateY(-50%);z-index:10;background:rgba(0,0,0,.60);padding:8px;border-radius:10px;border:1px solid rgba(255,58,138,.4);display:none;font:11px system-ui,sans-serif;color:#fff;text-align:center}
    #bloch.on{display:block}
    #bloch svg{display:block;width:140px;height:140px}
    #bloch .dirac{margin-top:5px;font-size:11px;font-family:'Cambria Math','Latin Modern Math',serif;white-space:nowrap}
    #bloch .vc{margin-top:2px;font-size:9px;opacity:.7}
    #bloch .lbl{font-size:9px;opacity:.7;margin-bottom:3px}
    #vortexCount{position:fixed;left:8px;top:8px;z-index:10;background:rgba(0,0,0,.6);padding:5px 9px;border-radius:8px;color:#fff;font:bold 12px system-ui,sans-serif;display:none}
    #vortexCount.on{display:block}

    #status{position:fixed;right:8px;top:8px;z-index:10;background:rgba(0,0,0,.62);padding:8px 10px;border-radius:8px;font-size:11px;transition:opacity .7s ease}
    #status.hidden{opacity:0;pointer-events:none}
    /* v23: real aircraft attitude indicator (ADI) — sky/ground ball, pitch ladder, fixed bird */
    #center{position:fixed;left:50%;bottom:6vh;top:auto;width:160px;height:160px;margin-left:-80px;margin-top:0;z-index:9;pointer-events:none;filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
    #center svg{display:block;width:100%;height:100%;overflow:hidden}
    canvas{display:block}
  </style>
</head>
<body>
  <div id="ui">
    <div class="ui-row">
      <button id="startBtn">START</button>
      <button class="boost" id="boostBtn">BOOST: OFF</button>
    </div>
    <button id="gameBtn">GAME MODE</button>
    <div class="ui-row">
      <button class="dark" id="resetBtn">RESET</button>
      <button class="dark" id="fullBtn">FULL SCREEN</button>
    </div>
    <button class="secondary" id="motionBtn">ENABLE PHONE MOTION</button>
  </div>
  <div id="status">Loading real GDS texture...</div>

  <!-- v27: HUD restacked — instrument row on top, Qarakal logo below. -->
  <div id="hud">
    <div class="row">
      <div class="cell map-cell">
        <div class="lbl">map</div>
        <canvas id="miniMap" width="120" height="120"></canvas>
      </div>
      <div class="cell">
        <div class="lbl">speed</div>
        <div class="val" id="speedValue">—</div>
        <div class="unit">µm/s</div>
        <div class="gauge"><div class="arc"></div><div id="needle" class="needle"></div></div>
      </div>
      <div class="cell">
        <div class="lbl">altitude</div>
        <div class="val" id="altValue">—</div>
        <div class="unit">µm</div>
        <div class="gauge"><div class="arc"></div><div id="altNeedle" class="needle altNeedle"></div></div>
      </div>
    </div>
    <div class="cell logo-cell">
      <img id="logo" src="qarakal-logo.svg" alt="Qarakal" onerror="this.classList.add('hidden')" />
    </div>
  </div>

  <!-- v37: game-mode panels -->
  <div id="vortexCount">VORTICES: <span id="vc">5</span> / 5</div>
  <div id="bloch">
    <div class="lbl">QUBIT STATE</div>
    <svg viewBox="-60 -60 120 120">
      <!-- equator and outline -->
      <ellipse cx="0" cy="0" rx="50" ry="50" fill="none" stroke="#3a4a66" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="50" ry="14" fill="none" stroke="#3a4a66" stroke-width="0.6" stroke-dasharray="2 2"/>
      <!-- z axis -->
      <line x1="0" y1="-58" x2="0" y2="58" stroke="#445566" stroke-width="0.5"/>
      <line x1="-56" y1="0" x2="56" y2="0" stroke="#445566" stroke-width="0.5"/>
      <!-- |0> and |1> labels -->
      <text x="0" y="-52" fill="#9bc2ff" font-size="8" text-anchor="middle" font-family="serif" font-style="italic">|0⟩</text>
      <text x="0" y="58"  fill="#ff9bbc" font-size="8" text-anchor="middle" font-family="serif" font-style="italic">|1⟩</text>
      <!-- state vector — JS animates this -->
      <line id="blochVec" x1="0" y1="0" x2="0" y2="-50" stroke="#ff3a8a" stroke-width="2.2" stroke-linecap="round"/>
      <circle id="blochTip" cx="0" cy="-50" r="2.6" fill="#ff3a8a"/>
    </svg>
    <div class="dirac" id="blochDirac">|ψ⟩ = |+⟩</div>
    <div class="vc" id="blochCoh">coherence: 100%</div>
  </div>
  <div id="gameMsg"></div>
  <div id="center"></div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
  <script src="chip-data.js"></script>
  <script>
  (()=>{
    const status=document.getElementById('status'), hud=document.getElementById('hud'),
          speedValue=document.getElementById('speedValue'), needle=document.getElementById('needle'),
          altValue=document.getElementById('altValue'), altNeedle=document.getElementById('altNeedle');
    let running=false, motion=false, boost=false;
    let yaw=0, pitch=-0.42, targetYaw=0, targetPitch=-0.42, lastT=performance.now();
    let initialOri=null, currentOri=null;
    const data=window.CHIP_DATA || {bbox:[0,0,10000,10000],layers:{}};
    const bbox=data.bbox || [0,0,10000,10000];
    const chipUm={w:bbox[2]-bbox[0], h:bbox[3]-bbox[1]};
    const UM_PER_UNIT=1000;
    const chipW=chipUm.w/UM_PER_UNIT, chipH=chipUm.h/UM_PER_UNIT;
    // v26: Nb thickness back to 1 µm visual. (Real Nb is 200 nm but the photon needs
    // enough vertical slack to drop into the etched openings cleanly.)
    const NB_THICKNESS_UM=1;
    const maxZ=10000, minZ=0;
    const state={x:chipUm.w/2, y:chipUm.h/2, z:2200};

    // v23: stereo eye separation — tuned WAY down + dynamic TOE-IN convergence.
    // v22 used fixed-parallel cameras with a 220 µm IPD. That produced large disparity
    // for far-away objects, which is why high altitude looked "double" — the brain couldn't
    // fuse the two views. Now the cameras toe in so they converge on whatever the photon
    // is actually looking at, and the IPD is small. Result: zero disparity on the object of
    // interest at any altitude, clean stereo fusion.
    const IPD_UM = 70;
    // v27: allow convergence as close as 20 µm — without this, focusing on a feature
    // a few microns away was clamped to 500 µm convergence and the brain couldn't fuse.
    const CONV_MIN_UNIT = 0.02;
    const CONV_MAX_UNIT = 12.0;
    const CONV_DEFAULT_UNIT = 3.0;
    // v27: cap the per-eye angular disparity so close-up never exceeds what the eye can
    // converge. 1.5° = 0.026 rad. Effective eye-separation shrinks proportionally when the
    // photon is close to its target — same trick a microscope user's brain does.
    const MAX_DISPARITY_RAD = 0.026;

    const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0c1622);
    // v26: near plane pushed from 0.5 µm out to 10 µm. The old 0.0005 covered a
    // 160 000:1 depth range, which left the buffer with almost no precision in the chip
    // mid-distances — that's the textbook cause of "thin features flicker far away,
    // resolve up close." 10 µm is still well below our photon scale (~5 µm) so we don't
    // visibly clip.
    const camera=new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 80);
    camera.up.set(0,0,1);
    // v26: logarithmic depth buffer — distributes z precision LOGARITHMICALLY across the
    // near→far range instead of front-loading it near the camera. With layers stacked at
    // 1.2 / 1.55 / 1.95 µm above Nb, this is what stops them from z-fighting each other
    // and the painted texture overlay above.
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance',logarithmicDepthBuffer:true});
    // v24: lower pixel-ratio cap (1.75) to ease GPU load and cut the per-pixel flicker
    // we were seeing on dense polygons. Cardboard further drops to 1.25 in renderStereo.
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.75)); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
    // v22: a touch more light. Nb is now significantly brighter (see material below), so
    // we keep ambient moderate so the dark Si still reads as dark.
    scene.add(new THREE.HemisphereLight(0xffffff,0x556677,1.85));
    const dirLight=new THREE.DirectionalLight(0xffffff,1.75); dirLight.position.set(2,5,3); scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0xb0c4dd, 0.28));
    const siThicknessUnit=500/UM_PER_UNIT;
    const baseGeo=new THREE.BoxGeometry(chipW,chipH,siThicknessUnit);
    // Silicon stays dark — almost matte black — so the bright Nb really pops next to it.
    const baseMat=new THREE.MeshStandardMaterial({color:0x121417,roughness:.95,metalness:.01});
    const base=new THREE.Mesh(baseGeo,baseMat); base.position.set(0,0,-siThicknessUnit/2); scene.add(base);

    // ---- v26: decimation reverted to a pass-through (full xy resolution restored).
    // The "long lines that flicker at distance" turned out to be the 3-px polygon STROKES
    // painted into the canvas overlay (see makeTexture below) plus z-fighting between
    // closely-stacked layers — not the polygon vertex count. Hook kept here in case we
    // want to dial it back in for very low-end devices.
    function decimatePoly(p){ return p; }
    // Replace each layer's polygon list in-place with the halved version so EVERY
    // downstream consumer (trench cutout, 3D extrusion, minimap, collision) sees the
    // simplified geometry.
    const _LAYERS_TO_DECIMATE = ['131','134','136','137','146','147'];
    for (const lid of _LAYERS_TO_DECIMATE){
      const polys = data.layers[lid];
      if (!polys) continue;
      data.layers[lid] = polys.map(decimatePoly);
    }

    // ---- v13: real 3D Nb layer with etched holes (layer 134). Photon can't pass through it.
    function nbMapPt(p){ return [(p[0]-bbox[0]-chipUm.w/2)/UM_PER_UNIT, (p[1]-bbox[1]-chipUm.h/2)/UM_PER_UNIT]; }
    const chipShape = new THREE.Shape();
    chipShape.moveTo(-chipW/2, -chipH/2);
    chipShape.lineTo( chipW/2, -chipH/2);
    chipShape.lineTo( chipW/2,  chipH/2);
    chipShape.lineTo(-chipW/2,  chipH/2);
    chipShape.closePath();
    const trench134 = (data.layers['134']||[]).filter(p=>p && p.length>=3);
    for (const p of trench134){
      const hole = new THREE.Path();
      const a = nbMapPt(p[0]); hole.moveTo(a[0], a[1]);
      for (let i=1;i<p.length;i++){ const m=nbMapPt(p[i]); hole.lineTo(m[0], m[1]); }
      hole.closePath();
      chipShape.holes.push(hole);
    }
    const nbHeight = NB_THICKNESS_UM/UM_PER_UNIT;
    let nbMesh=null;
    // v22: MUCH brighter Nb so it stands out against the dark Si — critical for cardboard
    // where the lens darkens and softens everything. Lower metalness keeps it luminous
    // instead of reading as a dark mirror.
    const NB_COLOR = 0xf2f5fa;
    const NB_METAL = 0.55;
    const NB_ROUGH = 0.35;
    try {
      const nbGeo = new THREE.ExtrudeGeometry(chipShape, {depth: nbHeight, bevelEnabled:false, curveSegments:1});
      const nbMat = new THREE.MeshStandardMaterial({color:NB_COLOR, metalness:NB_METAL, roughness:NB_ROUGH});
      nbMesh = new THREE.Mesh(nbGeo, nbMat);
      scene.add(nbMesh);
    } catch(e){
      console.warn('Nb extrusion failed, falling back to flat film:', e);
      const flat = new THREE.Mesh(new THREE.BoxGeometry(chipW, chipH, nbHeight), new THREE.MeshStandardMaterial({color:NB_COLOR, metalness:NB_METAL, roughness:NB_ROUGH}));
      flat.position.z = nbHeight/2;
      scene.add(flat);
    }

    function makeTexture(){
      const S=12288, c=document.createElement('canvas'); c.width=c.height=S; const g=c.getContext('2d');
      // v13: transparent background — the 3D Nb extrusion is the visual base.
      // Don't paint layer 134 (it's real geometry now); paint other layers as ID overlays.
      g.clearRect(0,0,S,S);
      function map(pt){ return [(pt[0]-bbox[0])/chipUm.w*S, S-(pt[1]-bbox[1])/chipUm.h*S]; }
      const styles={
        '136':'rgba(248,250,252,.85)',
        '137':'rgba(215,226,238,.80)',
        '131':'rgba(255,150,250,.95)'
      };
      // v15: 146/147 are 3D meshes now, no longer painted on the texture.
      // v26: NO MORE STROKES. The 3-px outlines around every painted polygon were the
      // long bright lines that flickered at distance — at chip distance, a 3-px stroke on
      // a 12288-px canvas is sub-pixel, so it aliased into long shimmering streaks every
      // frame. Filled-only now, with crisp edges from the polygon fill itself.
      const order=['131','136','137'];
      for(const layer of order){
        const polys=data.layers[layer]||[];
        g.fillStyle=styles[layer]||'rgba(255,255,255,.6)';
        for(const p of polys){
          if(!p||p.length<3) continue;
          g.beginPath();
          const a=map(p[0]); g.moveTo(a[0],a[1]);
          for(let i=1;i<p.length;i++){ const m=map(p[i]); g.lineTo(m[0],m[1]); }
          g.closePath();
          g.fill();
        }
      }
      const tex=new THREE.CanvasTexture(c);
      // v26: max-out anisotropic filtering — keeps thin GDS features (CPW gaps, junction
      // leads) crisp at oblique viewing angles instead of moiré-ing.
      const maxA = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;
      tex.anisotropy = maxA;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.generateMipmaps = true;
      tex.needsUpdate=true; return tex;
    }
    // v26: polygonOffset pushes this textured plane SLIGHTLY toward the camera at
    // render-time, so it stops z-fighting with the Nb extrusion underneath. Combined with
    // logarithmicDepthBuffer this kills the painted-texture shimmer at altitude.
    const topMat=new THREE.MeshBasicMaterial({
      map:makeTexture(), side:THREE.DoubleSide,
      transparent:true, depthWrite:false,
      polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2
    });
    const top=new THREE.Mesh(new THREE.PlaneGeometry(chipW,chipH),topMat);
    top.position.z = nbHeight + 0.002; // bigger gap above the Nb top, with polygonOffset on top of that
    scene.add(top);
    const edge=new THREE.LineSegments(new THREE.EdgesGeometry(baseGeo), new THREE.LineBasicMaterial({color:0x88aaff,transparent:true,opacity:.35})); edge.position.copy(base.position); scene.add(edge);

    // ---- v13: 3D meshes for the qubit pads, junction leads, and Josephson junctions.
    const detailGroup = new THREE.Group(); scene.add(detailGroup);
    function shapeFromPoly(p){
      const s = new THREE.Shape();
      s.moveTo((p[0][0]-bbox[0]-chipUm.w/2)/UM_PER_UNIT, (p[0][1]-bbox[1]-chipUm.h/2)/UM_PER_UNIT);
      for (let i=1;i<p.length;i++){
        s.lineTo((p[i][0]-bbox[0]-chipUm.w/2)/UM_PER_UNIT, (p[i][1]-bbox[1]-chipUm.h/2)/UM_PER_UNIT);
      }
      return s;
    }
    function addLayerMeshes(layerId, color, emissive, emissiveIntensity, thickUm, baseZUm, opts){
      opts = opts || {};
      const polys = data.layers[layerId] || [];
      const tUnit = Math.max(thickUm/UM_PER_UNIT, 0.0001);
      const baseZ = baseZUm/UM_PER_UNIT;
      const matCfg = {
        color, emissive, emissiveIntensity,
        roughness: opts.roughness != null ? opts.roughness : 0.32,
        metalness: opts.metalness != null ? opts.metalness : 0.85
      };
      if (opts.opacity != null && opts.opacity < 1.0){
        matCfg.transparent = true;
        matCfg.opacity = opts.opacity;
        matCfg.depthWrite = false;
      }
      const mat = new THREE.MeshStandardMaterial(matCfg);
      for (const p of polys){
        if (!p || p.length<3) continue;
        try {
          const geo = new THREE.ExtrudeGeometry(shapeFromPoly(p), {depth: tUnit, bevelEnabled:false, curveSegments:2});
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.z = baseZ;
          detailGroup.add(mesh);
        } catch(e){}
      }
    }
    // v26: layer thicknesses restored, BUT z-offsets pushed apart so we have a clearer
    // "altitude budget" between layers and the depth buffer can resolve each one cleanly.
    // (Old offsets +0.05 / +0.20 / +0.34 were too tight for a depth buffer covering 0.01
    // to 80 world units — adjacent layers shimmered against each other.)
    addLayerMeshes('136', 0xffe8b8, 0x402200, 0.35, 0.13, NB_THICKNESS_UM + 0.20);
    addLayerMeshes('137', 0xffd070, 0x553200, 0.55, 0.13, NB_THICKNESS_UM + 0.55);
    addLayerMeshes('131', 0xff66ee, 0xff44cc, 1.5, 0.08, NB_THICKNESS_UM + 0.95, {roughness:0.2, metalness:0.4});

    // ---- v15: bandaid crossover dielectric (layer 146)
    const D146_THICK = 1.5 * NB_THICKNESS_UM;
    addLayerMeshes('146', 0x9be3ff, 0x224a66, 0.35, D146_THICK, NB_THICKNESS_UM, {roughness:0.45, metalness:0.05, opacity:0.55});
    const D147_THICK = 2.0 * NB_THICKNESS_UM;
    addLayerMeshes('147', 0xeef4ff, 0x3a4a66, 0.20, D147_THICK, NB_THICKNESS_UM + D146_THICK, {roughness:0.3, metalness:0.85, opacity:0.92});

    // ---- blue/orange glow halos around the 8 lumped-element resonators
    const qubitCenters = [
      [6136, 4975],   [3814, 4975],
      [5925, 5762.5], [4025, 5762.5],
      [4975, 6266],   [4025, 3862.5],
      [4975, 3684],   [5925, 3862.5]
    ];
    const haloGroup = new THREE.Group(); scene.add(haloGroup);
    const halos = [];
    function makeHaloTex(isBlue){
      const cv = document.createElement('canvas'); cv.width=cv.height=512;
      const cg = cv.getContext('2d');
      const grd = cg.createRadialGradient(256,256,6,256,256,256);
      if (isBlue){
        grd.addColorStop(0,    'rgba(190,225,255,1.0)');
        grd.addColorStop(0.18, 'rgba(70,170,255,0.85)');
        grd.addColorStop(0.50, 'rgba(40,130,255,0.30)');
        grd.addColorStop(1.00, 'rgba(20,90,200,0)');
      } else {
        grd.addColorStop(0,    'rgba(255,235,180,1.0)');
        grd.addColorStop(0.18, 'rgba(255,165,40,0.85)');
        grd.addColorStop(0.50, 'rgba(255,110,20,0.30)');
        grd.addColorStop(1.00, 'rgba(180,60,0,0)');
      }
      cg.fillStyle = grd; cg.fillRect(0,0,512,512);
      return new THREE.CanvasTexture(cv);
    }
    qubitCenters.forEach(([cx,cy], i)=>{
      const isBlue = (i % 2 === 0);
      const tex = makeHaloTex(isBlue);
      const mat = new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false, blending: THREE.AdditiveBlending});
      const sizeUm = 820;
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(sizeUm/UM_PER_UNIT, sizeUm/UM_PER_UNIT), mat);
      mesh.position.set((cx-chipUm.w/2)/UM_PER_UNIT, (cy-chipUm.h/2)/UM_PER_UNIT, nbHeight + 0.001);
      mesh.userData = {phase: i*0.785, isBlue};
      haloGroup.add(mesh); halos.push(mesh);
    });

    // ---- one green sinusoidal glow per SQUID
    function makeGreenTex(){
      const cv = document.createElement('canvas'); cv.width=cv.height=256;
      const cg = cv.getContext('2d');
      const grd = cg.createRadialGradient(128,128,2,128,128,124);
      grd.addColorStop(0,    'rgba(225,255,205,1.0)');
      grd.addColorStop(0.18, 'rgba(90,255,130,0.9)');
      grd.addColorStop(0.50, 'rgba(40,210,90,0.4)');
      grd.addColorStop(1.00, 'rgba(0,80,30,0)');
      cg.fillStyle = grd; cg.fillRect(0,0,256,256);
      return new THREE.CanvasTexture(cv);
    }
    const greenTex = makeGreenTex();
    const idcGroup = new THREE.Group(); scene.add(idcGroup);
    const idcPulses = [];
    qubitCenters.forEach(([cx,cy])=>{
      const sizeUm = 220;
      const mat = new THREE.MeshBasicMaterial({map: greenTex, transparent:true, depthWrite:false, blending: THREE.AdditiveBlending});
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(sizeUm/UM_PER_UNIT, sizeUm/UM_PER_UNIT), mat);
      mesh.position.set((cx-chipUm.w/2)/UM_PER_UNIT, (cy-chipUm.h/2)/UM_PER_UNIT, nbHeight + 0.0008);
      mesh.userData = {base: sizeUm/UM_PER_UNIT};
      idcGroup.add(mesh); idcPulses.push(mesh);
    });

    // ---- floor logic (Nb height except inside etched openings)
    function polyBounds(poly){ let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity; for(const q of poly){ minx=Math.min(minx,q[0]); miny=Math.min(miny,q[1]); maxx=Math.max(maxx,q[0]); maxy=Math.max(maxy,q[1]); } return {minx,miny,maxx,maxy,w:maxx-minx,h:maxy-miny}; }
    const trenchPolys=trench134.map(poly=>({poly,b:polyBounds(poly)}));
    function pointInPoly(x,y,poly){ let inside=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const xi=poly[i][0]-bbox[0], yi=poly[i][1]-bbox[1], xj=poly[j][0]-bbox[0], yj=poly[j][1]-bbox[1]; const hit=((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi+1e-9)+xi); if(hit) inside=!inside; } return inside; }
    function isInTrench(x,y){ for(const t of trenchPolys){ const b=t.b; if(x+bbox[0]>=b.minx && x+bbox[0]<=b.maxx && y+bbox[1]>=b.miny && y+bbox[1]<=b.maxy && pointInPoly(x,y,t.poly)) return true; } return false; }
    function floorZAt(x,y){ return isInTrench(x,y) ? 0 : NB_THICKNESS_UM; }
    status.textContent='v22: brighter Nb, lift-on-level, stereo IPD, cardboard mini-map HUD.'; setTimeout(()=>status.classList.add('hidden'),5500);

    // ---- Minimap: cache the static chip layout once, then redraw player dot each frame.
    // Used by the main HUD canvas and by both cardboard-eye HUD canvases.
    const miniBg = document.createElement('canvas'); miniBg.width = miniBg.height = 120;
    (function drawMiniBg(){
      const g = miniBg.getContext('2d');
      g.clearRect(0,0,120,120);
      // chip background = dark Si tone
      g.fillStyle = '#1a1d24';
      g.fillRect(0,0,120,120);
      // bright Nb outline (so the minimap matches the new Nb/Si contrast)
      g.strokeStyle = '#cfd6e0'; g.lineWidth = 1;
      g.strokeRect(0.5, 0.5, 119, 119);
      // etched openings = darker patches (exposed Si)
      g.fillStyle = 'rgba(60,75,95,0.85)';
      for (const p of trench134){
        if (!p || p.length<3) continue;
        g.beginPath();
        for (let i=0;i<p.length;i++){
          const x = (p[i][0]-bbox[0])/chipUm.w * 120;
          const y = 120 - (p[i][1]-bbox[1])/chipUm.h * 120;
          if (i===0) g.moveTo(x,y); else g.lineTo(x,y);
        }
        g.closePath(); g.fill();
      }
      // qubit centers — small bright dots
      for (const [cx,cy] of qubitCenters){
        const x = cx/chipUm.w * 120;
        const y = 120 - cy/chipUm.h * 120;
        g.fillStyle = '#59ffc0';
        g.beginPath(); g.arc(x,y,1.6,0,Math.PI*2); g.fill();
      }
    })();
    const miniMainCanvas = document.getElementById('miniMap');
    const cbMapCanvases = Array.from(document.querySelectorAll('.cb-map'));
    function paintMini(target){
      const g = target.getContext('2d');
      const W = target.width, H = target.height;
      g.imageSmoothingEnabled = true;
      g.drawImage(miniBg, 0, 0, W, H);
      // player position
      const px = (state.x/chipUm.w) * W;
      const py = H - (state.y/chipUm.h) * H;
      // facing arrow (yaw=0 = +y world / up on map; map y is inverted)
      const fx = Math.sin(yaw), fy = Math.cos(yaw);
      const ax = px + fx * 7, ay = py - fy * 7;
      g.strokeStyle = 'rgba(255,60,60,0.95)'; g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(px, py); g.lineTo(ax, ay); g.stroke();
      // player dot
      g.fillStyle = '#ff3a3a';
      g.beginPath(); g.arc(px, py, 2.6, 0, Math.PI*2); g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 0.8;
      g.beginPath(); g.arc(px, py, 2.6, 0, Math.PI*2); g.stroke();
    }
    function paintAllMinis(){
      paintMini(miniMainCanvas);
      for (const c of cbMapCanvases) paintMini(c);
    }

    function lookDirection(){
      return new THREE.Vector3(
        Math.sin(yaw)*Math.cos(pitch),
        Math.cos(yaw)*Math.cos(pitch),
        Math.sin(pitch)
      ).normalize();
    }
    function updateCamera(){
      // wrap yaw delta the short way around
      let dy = targetYaw - yaw;
      while (dy >  Math.PI) dy -= 2*Math.PI;
      while (dy < -Math.PI) dy += 2*Math.PI;
      yaw += dy * 0.08;
      pitch += (targetPitch-pitch)*0.08; pitch=Math.max(-1.35,Math.min(1.25,pitch));
      const wx=(state.x-chipUm.w/2)/UM_PER_UNIT, wy=(state.y-chipUm.h/2)/UM_PER_UNIT, wz=state.z/UM_PER_UNIT;
      camera.position.set(wx,wy,wz);
      const d=lookDirection();
      camera.lookAt(camera.position.x+d.x, camera.position.y+d.y, camera.position.z+d.z);
    }
    function forward(){ return lookDirection(); }

    // proximity-driven vibration around SQUIDs
    let lastVibrate = 0;
    function pulseVibrate(t){
      if (!navigator.vibrate) return;
      let minD = Infinity;
      for (const [cx,cy] of qubitCenters){
        const dx = state.x - cx, dy = state.y - cy;
        const dxy = Math.sqrt(dx*dx + dy*dy);
        const d3 = Math.sqrt(dxy*dxy + state.z*state.z);
        if (d3 < minD) minD = d3;
      }
      const RANGE = 800; // v30
      if (minD > RANGE) return;
      const f = 1 - (minD / RANGE);
      const interval = 420 - 365 * f;
      const duration = 14 + 61 * f;
      if (t - lastVibrate > interval){
        try { navigator.vibrate(duration); } catch(e){}
        lastVibrate = t;
      }
    }

    // v23: stronger aircraft-with-flaps LIFT. At pitch=0 (looking at horizon) the photon
    // climbs hard — you'd need a noticeable nose-down attitude (~-30°) to maintain altitude,
    // or push the nose down further to actually dive.
    const LIFT_FACTOR = 0.95; // v38: stronger lift so you can pull out of steep dives

    // v28: depth-probe stereo. Cast a ray from the camera in the look direction every
    // frame and use the FIRST geometry hit as the convergence distance. That way the eyes
    // converge on whatever the photon is actually staring at — chip surface, a SQUID pad,
    // a dielectric crossover, anything — instead of always trying to converge on z=0.
    // Smoothed with a low-pass so the disparity doesn't jitter when the ray skims edges.
    const stereoRaycaster = new THREE.Raycaster();
    stereoRaycaster.far = CONV_MAX_UNIT + 1;
    let smoothConvDist = CONV_DEFAULT_UNIT;
    function probeConvergence(){
      // v30: cheap plane intercept only — raycasting the full GDS every frame was
      // crashing the phone. Convergence = where the look ray hits the chip top (z=0),
      // clamped, smoothed.
      const dir = lookDirection();
      let raw = CONV_DEFAULT_UNIT;
      if (dir.z < -0.03){
        const tHit = -camera.position.z / dir.z;
        if (tHit > 0) raw = tHit;
      }
      raw = Math.max(CONV_MIN_UNIT, Math.min(CONV_MAX_UNIT, raw));
      smoothConvDist += (raw - smoothConvDist) * 0.18;
      return smoothConvDist;
    }

    // v29: PROPER VR — Three.js StereoCamera = parallel eyes + off-axis (asymmetric)
    // projection matrices. This is what every SBS Cardboard video and every real VR
    // engine uses. The old toe-in rotation introduced vertical disparity at the edges
    // that the brain CAN'T fuse (that's what you were seeing as "two unaligned images").
    // eyeSep is in world units (1 unit = 1 mm here). 0.06 ≈ 60 mm — a touch under real
    // human IPD, which gives the chip a strong but comfortable depth feel.
    const stereoCam = new THREE.StereoCamera();
    // v36: PROPER IPD. With 1 world unit = 1 mm, real human IPD is 64. Using 0.07 (70 µm)
    // before gave essentially zero parallax — that was the actual bug. Don't change this
    // unless you really know what you're doing.
    stereoCam.eyeSep = 64;
    function renderStereo(){
      const halfW = innerWidth/2, h = innerHeight;
      // v31: pass FULL aspect — StereoCamera applies its own 0.5x for the half viewport.
      // Halving here too was the actual cause of the "double" outside close-up.
      // v36: full window aspect (NOT halved) — StereoCamera builds asymmetric frusta from
       // this and the per-eye viewport renders correctly. Halving here squashes the image.
      camera.aspect = innerWidth/h;
      const prevFov = camera.fov, prevFocus = camera.focus;
      camera.fov = 70;
      // Focus = convergence depth, in mm. probeConvergence tracks the chip-surface intercept.
      camera.focus = probeConvergence();
      // Camera might be parented or not — be safe.
      camera.updateMatrixWorld(true);
      camera.updateProjectionMatrix();

      stereoCam.update(camera);

      renderer.setScissorTest(true);
      renderer.setViewport(0, 0, halfW, h);
      renderer.setScissor (0, 0, halfW, h);
      renderer.render(scene, stereoCam.cameraL);

      renderer.setViewport(halfW, 0, halfW, h);
      renderer.setScissor (halfW, 0, halfW, h);
      renderer.render(scene, stereoCam.cameraR);
      renderer.setScissorTest(false);

      camera.fov = prevFov;
      camera.focus = prevFocus;
    }

    function step(t){ requestAnimationFrame(step); const dt=Math.min(.05,(t-lastT)/1000); lastT=t;
      if(motion && currentOri && initialOri){
        let da=(currentOri.alpha-initialOri.alpha)*Math.PI/180;
        if(da>Math.PI)da-=2*Math.PI; if(da<-Math.PI)da+=2*Math.PI;
        targetYaw=-da;
        let db=(currentOri.beta -initialOri.beta )*Math.PI/180;
        if(db>Math.PI)db-=2*Math.PI; if(db<-Math.PI)db+=2*Math.PI;
        let dg=(currentOri.gamma-initialOri.gamma)*Math.PI/180;
        if(dg> Math.PI/2)dg-=Math.PI; if(dg<-Math.PI/2)dg+=Math.PI;
        const orientationDeg = (typeof window.orientation === 'number')
          ? window.orientation
          : ((screen.orientation && screen.orientation.angle) || 0);
        const o = orientationDeg * Math.PI/180;
        const tilt = db*Math.cos(o) - dg*Math.sin(o);
        targetPitch = tilt - .42;
        targetPitch = Math.max(-1.35, Math.min(1.25, targetPitch));
      }
      updateCamera();
      const boostFactor = boost ? 5 : 1;
      if(running){
        const zForSpeed=Math.max(0,state.z);
        const v=Math.max(20, (9 + (zForSpeed/10)*(1 + 1.65*Math.pow(zForSpeed/maxZ,1.45)))) * boostFactor;
        const f=forward();
        // LIFT: even at pitch=0 the photon gains altitude. Dive enough to cancel it and you
        // start descending. f.z is sin(pitch); LIFT_FACTOR is the constant flap-lift added.
        const vz = (f.z + LIFT_FACTOR);
        const tx = state.x + f.x*v*dt;
        const ty = state.y + f.y*v*dt;
        const tz = state.z + vz *v*dt;
        const tFloor = floorZAt(tx, ty);
        const wallInTheWay = (tz < tFloor) && (tFloor > state.z + 1e-3);
        if (wallInTheWay){
          state.z = tFloor;
        } else {
          state.x = tx; state.y = ty;
          state.z = Math.max(tFloor, tz);
        }
        state.x=Math.max(0,Math.min(chipUm.w,state.x));
        state.y=Math.max(0,Math.min(chipUm.h,state.y));
        const floor=floorZAt(state.x,state.y);
        state.z=Math.max(floor,Math.min(maxZ,state.z));
      }
      pulseVibrate(t);
      const zForSpeed2=Math.max(0,state.z);
      const v=Math.max(20, (9 + (zForSpeed2/10)*(1 + 1.65*Math.pow(zForSpeed2/maxZ,1.45)))) * boostFactor;
      speedValue.textContent=v.toFixed(1);
      const maxSpeed=(9 + (maxZ/10)*(1+1.65)) * 5;
      const angle=-82+164*Math.max(0,Math.min(1,v/maxSpeed));
      needle.style.transform=`rotate(${angle}deg)`;
      const altFrac = Math.max(0, Math.min(1, state.z / maxZ));
      altValue.textContent = state.z.toFixed(0);
      altNeedle.style.transform = `rotate(${-82 + 164*altFrac}deg)`;

      // mirror values into the cardboard HUDs
      const vStr = v.toFixed(1), aStr = state.z.toFixed(0);
      for (const el of document.querySelectorAll('.cbSpeed')) el.textContent = vStr;
      for (const el of document.querySelectorAll('.cbAlt'))   el.textContent = aStr;

      // mini-maps (main + both cardboard halves) and ADI (main + both cardboard halves)
      paintAllMinis();
      updateADI();

      const tt=t/1000;
      for (const h of halos){
        const breath = 0.55 + 0.45*Math.sin(tt*2.4 + h.userData.phase);
        h.material.opacity = 0.55 + 0.45*breath;
        const s = 1 + 0.10*breath;
        h.scale.set(s, s, 1);
      }
      const squidPulse = 0.5 + 0.5*Math.sin(tt*1.6);
      for (const p of idcPulses){
        p.material.opacity = 0.10 + 0.90*squidPulse;
        const s = 0.55 + 0.55*squidPulse;
        p.scale.set(s, s, 1);
      }
      gameStep(dt);
      camera.aspect=innerWidth/innerHeight;
      camera.fov = 70;
      camera.updateProjectionMatrix();
      renderer.setViewport(0,0,innerWidth,innerHeight);
      renderer.render(scene,camera);
    }
    requestAnimationFrame(step);

    function updateADI(){}

    // ===================================================================================
    // v37: GAME MODE — eliminate 5 flux vortices near SQUIDs before the qubit state decays.
    // Pass over a vortex at z<200 µm to eliminate it. Avoid getting within 100 µm of a SQUID.
    // ===================================================================================
    const game = { active:false, theta:Math.PI/2, phi:0, vortices:[], won:false, lost:false, lostReason:'', startT:0 };
    const vortexGroup = new THREE.Group(); scene.add(vortexGroup);
    const blochEl = document.getElementById('bloch');
    const blochVec = document.getElementById('blochVec');
    const blochTip = document.getElementById('blochTip');
    const blochDirac = document.getElementById('blochDirac');
    const blochCoh = document.getElementById('blochCoh');
    const vortexCountEl = document.getElementById('vortexCount');
    const vcSpan = document.getElementById('vc');
    const gameMsg = document.getElementById('gameMsg');

    function buildVortexMesh(){
      // Red spiral, drawn into a canvas texture, on a flat plane that we point upward
      const cv = document.createElement('canvas'); cv.width=cv.height=256;
      const cg = cv.getContext('2d');
      // radial red glow background
      const grd = cg.createRadialGradient(128,128,4,128,128,128);
      grd.addColorStop(0,'rgba(255,255,200,1)');
      grd.addColorStop(0.10,'rgba(255,80,80,0.95)');
      grd.addColorStop(0.45,'rgba(255,30,30,0.55)');
      grd.addColorStop(1,'rgba(120,0,0,0)');
      cg.fillStyle=grd; cg.fillRect(0,0,256,256);
      // spiral arms
      cg.strokeStyle='rgba(255,230,230,0.92)'; cg.lineWidth=4;
      for (let arm=0; arm<3; arm++){
        cg.beginPath();
        for (let t=0; t<6.28*1.5; t+=0.04){
          const r = 8 + t*11;
          const a = t + arm*(6.28/3);
          const x = 128 + Math.cos(a)*r;
          const y = 128 + Math.sin(a)*r;
          if (t===0) cg.moveTo(x,y); else cg.lineTo(x,y);
        }
        cg.stroke();
      }
      const tex = new THREE.CanvasTexture(cv);
      const mat = new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending});
      const sizeUm = 380;
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(sizeUm/UM_PER_UNIT, sizeUm/UM_PER_UNIT), mat);
      // point light for "radiating red"
      const light = new THREE.PointLight(0xff3030, 3, 2.0, 2);
      mesh.add(light);
      return mesh;
    }

    function spawnVortices(){
      // clear any prior
      while (vortexGroup.children.length) vortexGroup.remove(vortexGroup.children[0]);
      game.vortices = [];
      // place 5 vortices NEAR (but not on) qubits — offset 350 µm in some direction
      const pickQubits = [0,1,2,3,4]; // first 5 of the 8 qubitCenters
      for (let i=0;i<5;i++){
        const [cx,cy] = qubitCenters[pickQubits[i]];
        const ang = i*(Math.PI*2/5) + 0.4;
        const r = 380;
        const vx = cx + Math.cos(ang)*r;
        const vy = cy + Math.sin(ang)*r;
        const mesh = buildVortexMesh();
        mesh.position.set((vx-chipUm.w/2)/UM_PER_UNIT,(vy-chipUm.h/2)/UM_PER_UNIT, (NB_THICKNESS_UM+8)/UM_PER_UNIT);
        mesh.userData.spinPhase = i*0.7;
        vortexGroup.add(mesh);
        game.vortices.push({x:vx,y:vy,mesh,alive:true});
      }
    }

    function diracStr(theta, phi){
      // |ψ⟩ = cos(θ/2)|0⟩ + e^{iφ}sin(θ/2)|1⟩
      const c = Math.cos(theta/2), s = Math.sin(theta/2);
      const fmt = (n)=> (Math.abs(n)<0.005)?'0':n.toFixed(2);
      // small helper to format the phase part: e^{iφ}
      let phaseStr='';
      const phase = ((phi%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
      if (Math.abs(phase) < 0.05 || Math.abs(phase-2*Math.PI)<0.05) phaseStr=''; // 0 → +
      else if (Math.abs(phase-Math.PI)<0.05) phaseStr='−';                       // π → −
      else phaseStr = 'e^{i·'+phase.toFixed(2)+'}·';
      if (Math.abs(s)<0.005) return '|ψ⟩ = |0⟩';
      if (Math.abs(c)<0.005) return '|ψ⟩ = '+phaseStr+'|1⟩';
      return '|ψ⟩ = '+fmt(c)+'|0⟩ + '+phaseStr+fmt(s)+'|1⟩';
    }

    function updateBloch(t, dt){
      if (!game.active) return;
      // spin phi fast, drift theta slowly toward 0
      game.phi += dt * 2.4;
      game.theta -= dt * (Math.PI/2 / 150); // v38: decays to |0⟩ in ~150 s
      if (game.theta < 0) game.theta = 0;
      // project the vector onto our 2D bloch view (z up = |0⟩, x = real Bloch x)
      const sinT = Math.sin(game.theta), cosT = Math.cos(game.theta);
      const X = sinT * Math.cos(game.phi);
      // we display in a 2D circle: x maps to screen-x, z maps to -screen-y (|0⟩ at top)
      const sx = X * 50;
      const sy = -cosT * 50;
      blochVec.setAttribute('x2', sx.toFixed(1));
      blochVec.setAttribute('y2', sy.toFixed(1));
      blochTip.setAttribute('cx', sx.toFixed(1));
      blochTip.setAttribute('cy', sy.toFixed(1));
      blochDirac.textContent = diracStr(game.theta, game.phi);
      // coherence = how far the state still is from |0⟩; sin(θ) is the "magnitude of |1⟩" part
      const coh = Math.round(sinT*100);
      blochCoh.textContent = 'coherence: '+coh+'%';
      // lose: state decayed
      if (game.theta < 0.04) endGame(false, 'Your quantum state decohered to |0⟩.');
    }

    function endGame(won, reason){
      if (!game.active) return;
      game.active=false; game.won=won; game.lost=!won; game.lostReason=reason||'';
      const title = won ? 'VICTORY' : 'GAME OVER';
      const colour = won ? '#59ffc0' : '#ff5577';
      gameMsg.innerHTML='<h2 style="color:'+colour+'">'+title+'</h2>'
        +'<div>'+(won?'All flux vortices eliminated, coherence preserved.':reason)+'</div>'
        +'<div style="margin-top:8px;display:flex;gap:8px;justify-content:center">'
        +'<button id="gameMsgRetry">TRY AGAIN</button>'
        +'<button id="gameMsgClose" style="background:#dde8ff;color:#06101f">EXIT</button>'
        +'</div>';
      gameMsg.style.display='block';
      document.getElementById('gameMsgClose').onclick=()=>{ gameMsg.style.display='none'; blochEl.classList.remove('on'); vortexCountEl.classList.remove('on'); while(vortexGroup.children.length)vortexGroup.remove(vortexGroup.children[0]); };
      document.getElementById('gameMsgRetry').onclick=()=>{
        gameMsg.style.display='none';
        while(vortexGroup.children.length)vortexGroup.remove(vortexGroup.children[0]);
        spawnVortices();
        game.active=true; game.won=false; game.lost=false;
        game.theta=Math.PI/2; game.phi=0; game.startT=performance.now();
        doReset();
        vcSpan.textContent='5';
        blochEl.classList.add('on'); vortexCountEl.classList.add('on');
      };
    }

    function gameStep(dt){
      // spin all live vortices
      const tt = performance.now()/1000;
      for (const v of game.vortices){
        if (!v.alive) continue;
        v.mesh.rotation.z = tt*3.0 + v.mesh.userData.spinPhase;
        const breath = 0.85 + 0.30*Math.sin(tt*2.8 + v.mesh.userData.spinPhase);
        v.mesh.scale.set(breath,breath,1);
      }
      if (!game.active) return;
      updateBloch(tt, dt);
      // collisions — passing OVER vortex at z<=200 µm = kill it. Passing within 100 µm of SQUID = lose.
      for (const v of game.vortices){
        if (!v.alive) continue;
        const dxy = Math.hypot(state.x - v.x, state.y - v.y);
        if (dxy < 180 && state.z < 200){
          v.alive = false;
          v.mesh.visible = false;
          if (navigator.vibrate) try{ navigator.vibrate([20,30,40]); }catch(e){}
          const left = game.vortices.filter(g=>g.alive).length;
          vcSpan.textContent = left;
          if (left===0) endGame(true);
        }
      }
      for (const [cx,cy] of qubitCenters){
        const d3 = Math.hypot(state.x-cx, state.y-cy, state.z);
        if (d3 < 100){ endGame(false, 'You hit a SQUID. Quantum state destroyed.'); return; }
      }
    }

    function startGame(){
      // explain rules
      gameMsg.innerHTML='<h2>GAME MODE</h2>'
        +'<div style="text-align:left;line-height:1.6">'
        +'• 5 flux vortices (red spirals) have appeared near the qubits.<br/>'
        +'• Fly OVER them at altitude < <b>200 µm</b> to eliminate each.<br/>'
        +'• Do NOT get within <b>100 µm</b> of any SQUID — it will destroy the state.<br/>'
        +'• Your qubit state decays toward |0⟩. Beat the clock before it reaches the pole.'
        +'</div><button id="gameMsgStart">BEGIN</button>';
      gameMsg.style.display='block';
      document.getElementById('gameMsgStart').onclick=()=>{
        gameMsg.style.display='none';
        spawnVortices();
        game.active=true; game.won=false; game.lost=false;
        game.theta=Math.PI/2; game.phi=0; game.startT=performance.now();
        blochEl.classList.add('on');
        vortexCountEl.classList.add('on');
        vcSpan.textContent='5';
        if (!running){ running=true; startBtn.textContent='PAUSE'; }
      };
    }

    let dragging=false,lastX=0,lastY=0;
    renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});
    addEventListener('pointerup',()=>dragging=false);
    addEventListener('pointermove',e=>{ if(!dragging||motion) return; targetYaw-=(e.clientX-lastX)*0.005; targetPitch-=(e.clientY-lastY)*0.005; lastX=e.clientX; lastY=e.clientY; });
    addEventListener('deviceorientation',e=>{ currentOri={alpha:e.alpha||0,beta:e.beta||0,gamma:e.gamma||0}; }, true);

    const startBtn=document.getElementById('startBtn');
    const boostBtn=document.getElementById('boostBtn');
    const gameBtn=document.getElementById('gameBtn');
    const motionBtn=document.getElementById('motionBtn');
    function refreshUiVisibility(){}

    // Phone motion enable, factored out so cardboard mode can auto-enable it.
    async function enablePhoneMotion(showStatus){
      try{
        if(typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission){
          const r=await DeviceOrientationEvent.requestPermission();
          if(r!=='granted'){
            if (showStatus){ status.classList.remove('hidden'); status.textContent='Phone motion permission denied.'; }
            return false;
          }
        }
        motion=true;
        motionBtn.textContent='DISABLE PHONE MOTION';
        initialOri=currentOri||{alpha:0,beta:0,gamma:0};
        if (showStatus){
          status.classList.remove('hidden');
          status.textContent='Phone motion enabled. Move/tilt the phone; touch drag is disabled while motion is on.';
          setTimeout(()=>status.classList.add('hidden'),5000);
        }
        return true;
      }catch(err){
        if (showStatus){ status.classList.remove('hidden'); status.textContent='Motion error: '+err.message; }
        return false;
      }
    }
    function disablePhoneMotion(){
      motion=false;
      motionBtn.textContent='ENABLE PHONE MOTION';
    }

    // v23: shared reset, callable from button, screen tap, and magnetometer spike.
    function doReset(){
      state.x=chipUm.w/2; state.y=chipUm.h/2; state.z=2200;
      targetYaw=yaw=0; targetPitch=pitch=-0.42;
      initialOri=currentOri;
      if (navigator.vibrate) { try{ navigator.vibrate(30);}catch(e){} }
    }

    startBtn.onclick=()=>{ running=!running; startBtn.textContent=running?'PAUSE':'START'; };
    boostBtn.onclick=()=>{
      boost=!boost;
      boostBtn.textContent='BOOST: '+(boost?'ON x5':'OFF');
      boostBtn.classList.toggle('active', boost);
      if (boost && navigator.vibrate) { try{ navigator.vibrate(20);}catch(e){} }
    };
    gameBtn.onclick=()=>{ startGame(); };
    document.getElementById('resetBtn').onclick=()=>{ doReset(); };
    document.getElementById('fullBtn').onclick=async()=>{ try{ if(!document.fullscreenElement){ await document.documentElement.requestFullscreen(); } else { await document.exitFullscreen(); } }catch(err){} };
    motionBtn.onclick=async()=>{ if(motion){ disablePhoneMotion(); } else { await enablePhoneMotion(true); } };
    addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);});
    refreshUiVisibility();
  })();
  </script>
</body>
</html>
